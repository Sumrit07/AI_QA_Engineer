<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI QA Engineer | Login</title>

    <link rel="stylesheet" href="/static/css/login.css">

</head>

<body>

<div class="login-box">

    <h1>🤖 AI QA Engineer</h1>

    <h3>Login</h3>

    <p class="subtitle">
        Enterprise AI Powered Software Quality Assurance
    </p>

    <input
        type="text"
        id="username"
        placeholder="Enter Username"
        autocomplete="username">

    <input
        type="password"
        id="password"
        placeholder="Enter Password"
        autocomplete="current-password">

    <button
        id="loginBtn"
        type="button">

        Login

    </button>

    <p id="msg"></p>

</div>

<script src="/static/js/login.js"></script>

</body>

</html>
